<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Airlines-RD-Admin — Generate CDC events</title>
  <style>
    :root {
      --ink: #0f1c2e;
      --muted: #4a5d73;
      --line: #c5d0dc;
      --sky: #1a6f9a;
      --sky-deep: #0e4d6e;
      --paper: #f3f6f9;
      --ok: #1b7a4e;
      --err: #9b2c2c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 10% -10%, #d7e8f4 0%, transparent 55%),
        linear-gradient(180deg, #e8eef4 0%, var(--paper) 40%, #eef2f6 100%);
    }
    header {
      padding: 2.5rem 1.5rem 1rem;
      max-width: 40rem;
      margin: 0 auto;
    }
    .brand {
      font-family: "IBM Plex Serif", Georgia, serif;
      font-size: 1.75rem;
      letter-spacing: -0.02em;
      margin: 0 0 0.35rem;
    }
    .lede {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
      max-width: 36rem;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 1rem 1.5rem 3rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }
    input[type="number"],
    input[type="text"] {
      width: 100%;
      padding: 0.7rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
      background: #fff;
      margin-bottom: 1rem;
    }
    .actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 0.25rem;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 6px;
      padding: 0.7rem 1.15rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      background: var(--sky);
      color: #fff;
      transition: background 160ms ease, transform 160ms ease;
    }
    button:hover { background: var(--sky-deep); }
    button:active { transform: translateY(1px); }
    button.secondary {
      background: transparent;
      color: var(--sky-deep);
      border: 1px solid var(--line);
    }
    #result {
      margin-top: 1.25rem;
      padding: 0.9rem 1rem;
      border-left: 3px solid var(--line);
      background: rgba(255,255,255,0.7);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
      min-height: 3rem;
    }
    #result.ok { border-color: var(--ok); }
    #result.err { border-color: var(--err); }
    footer {
      max-width: 40rem;
      margin: 0 auto;
      padding: 0 1.5rem 2rem;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <header>
    <h1 class="brand">Airlines-RD-Admin</h1>
    <p class="lede">Generate synthetic CDC events against <code>market_db.market_rule</code> via MasterData-API.</p>
  </header>
  <main>
    <label for="apiBase">API base URL</label>
    <input id="apiBase" type="text" value="http://127.0.0.1:8110" />

    <label for="count">Event count</label>
    <input id="count" type="number" min="1" max="100000" value="10" />

    <p class="lede" style="margin:0 0 1rem;font-size:0.9rem">
      Quick links:
      <a id="link10" href="#">generate 10</a> ·
      <a id="link100" href="#">generate 100</a> ·
      <a id="link1000" href="#">generate 1000</a>
    </p>

    <div class="actions">
      <button type="button" id="generateBtn">Generate CDC events</button>
      <button type="button" class="secondary" id="healthBtn">Check /health</button>
    </div>
    <div id="result" aria-live="polite"></div>
  </main>
  <footer>
    M02 bootstrap UI — POSTs <code>/admin/cdc/generate</code> with <code>{"count": N}</code>.
  </footer>
  <script>
    const result = document.getElementById("result");
    const apiBase = () => document.getElementById("apiBase").value.replace(/\/$/, "");

    async function checkHealth() {
      result.className = "";
      result.textContent = "Checking health…";
      try {
        const res = await fetch(apiBase() + "/health");
        const data = await res.json();
        result.className = res.ok ? "ok" : "err";
        result.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        result.className = "err";
        result.textContent = String(err);
      }
    }

    async function generate() {
      const count = Number(document.getElementById("count").value);
      result.className = "";
      result.textContent = "Generating…";
      try {
        const res = await fetch(apiBase() + "/admin/cdc/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ count }),
        });
        const data = await res.json();
        result.className = res.ok ? "ok" : "err";
        result.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        result.className = "err";
        result.textContent = String(err);
      }
    }

    document.getElementById("generateBtn").addEventListener("click", generate);
    document.getElementById("healthBtn").addEventListener("click", checkHealth);

    function wireQuick(id, n) {
      document.getElementById(id).addEventListener("click", (e) => {
        e.preventDefault();
        document.getElementById("count").value = String(n);
        generate();
      });
    }
    wireQuick("link10", 10);
    wireQuick("link100", 100);
    wireQuick("link1000", 1000);
  </script>
</body>
</html>
